coname: markdown-notes-local

services:
  web:
    image: nginx:alpine
    user: "101:101"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - site-data:/usr/share/nginx/html
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  site-data:
