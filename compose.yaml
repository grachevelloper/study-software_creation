services:
  app:
    build:
      context: .
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-before-public-deployment}
      ACCESS_TTL_SECONDS: 900
      REFRESH_TTL_SECONDS: 604800
      DATABASE_PATH: /data/notes.db
    volumes:
      - notes_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    user: "101:101"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - backend
      - frontend

volumes:
  notes_data:

networks:
  frontend: {}
  backend:
    internal: true
